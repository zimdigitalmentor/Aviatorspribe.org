# Render blueprint: the Docker image (PWA + /api) and a managed PostgreSQL database.
# New → Blueprint in the Render dashboard, then fill in the secrets marked sync: false.
services:
  - type: web
    name: aviator-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/plans
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: aviator-tracker-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PAYNOW_INTEGRATION_ID
        sync: false
      - key: PAYNOW_INTEGRATION_KEY
        sync: false
      - key: PAYNOW_MODE
        value: test
      - key: PAYNOW_TEST_AUTHEMAIL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPPORT_CONTACT
        sync: false
databases:
  - name: aviator-tracker-db
    plan: basic-256mb
